name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: mis_service_request_testing
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, exif, fileinfo, gd, mbstring, openssl, pdo_mysql, simplexml, zip
          coverage: none

      - name: Verify exception arguments are suppressed
        run: |
          if [ "$(php -r 'echo ini_get("zend.exception_ignore_args");')" != "1" ]; then
            echo "zend.exception_ignore_args must be On (1) in the active php.ini"
            php --ini
            php -i | grep zend.exception_ignore_args || true
            exit 1
          fi

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create testing environment file
        run: |
          cat > .env <<'EOF'
          APP_NAME="MIS Service Request System"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          FORCE_HTTPS=false
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=mis_service_request_testing
          DB_USERNAME=root
          DB_PASSWORD=
          CACHE_DRIVER=array
          QUEUE_CONNECTION=sync
          SESSION_DRIVER=array
          SESSION_SECURE_COOKIE=false
          MAIL_MAILER=array
          EOF

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Verify application boots (route listing)
        run: php artisan route:list > /dev/null

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run test suite
        run: vendor/bin/phpunit

      - name: Security audit (informational)
        run: composer audit
        continue-on-error: true
